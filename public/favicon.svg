<!-- The brand tile from the top bar, as the tab icon. Replaces the purple bolt
     Vite scaffolds in, which belonged to the build tool rather than to this app.
     Colours are literals because a favicon is fetched outside the document and
     never sees the page's custom properties: #0f7a69 is --color-accent on the
     light theme, #ffffff its --color-accent-fg. A tab icon cannot follow the
     theme the way the in-page tile does. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="11" fill="#0f7a69"/>
  <text x="24" y="25" fill="#ffffff" font-size="30" text-anchor="middle"
        dominant-baseline="central"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',
                     'Meiryo',sans-serif">か</text>
</svg>
