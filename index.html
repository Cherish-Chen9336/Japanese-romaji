<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kana. — Japanese typing practice</title>
    <meta
      name="description"
      content="Practice Japanese typing in your browser. Type the romaji for kana and kanji, and see which moras slow you down — per mora, not per word. No signup."
    />

    <!--
      These four carry the host, and the reason is not the one first written
      here. The claim was that Vite never processes `meta content`, so a
      root-relative `/og.png` would ship verbatim and 404 under this site's
      `/Japanese-romaji/` base. That is false, and the test behind it was no
      test at all: an absolute URL is deliberately left alone, so watching one
      survive the build says nothing about what happens to a relative one.

      Measured on this build (Vite 8.0.16), one tag changed at a time:

        og:image, twitter:image   /og.png      -> /Japanese-romaji/og.png
        canonical (link[href])    /og.png      -> /Japanese-romaji/og.png
        canonical (link[href])    /            -> BUILD FAILS, EISDIR
        canonical (link[href])    /no-such     -> left alone
        og:url                    anything     -> left alone

      So `link[href]` is processed whatever its rel — rewritten when it resolves
      to a file, fatal when it resolves to a directory — and `meta content` is
      processed for the image tags but not for og:url.

      They stay absolute because that is what the tags mean, not because a
      relative one could not be built. og:url and canonical are defined as the
      object's own absolute URL, and an absolute image URL is the portable
      choice even though some scrapers (Discord documents this) do resolve a
      root-relative one. Change all four together if the site ever moves.
    -->
    <link rel="canonical" href="https://cherish-chen9336.github.io/Japanese-romaji/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kana." />
    <meta property="og:url" content="https://cherish-chen9336.github.io/Japanese-romaji/" />
    <meta property="og:title" content="kana. — Japanese typing practice" />
    <meta
      property="og:description"
      content="Practice Japanese typing in your browser. Type the romaji for kana and kanji, and see which moras slow you down — per mora, not per word. No signup."
    />
    <meta property="og:image" content="https://cherish-chen9336.github.io/Japanese-romaji/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The kana. practice screen: a line of Japanese with the romaji being typed beneath it."
    />
    <meta property="og:locale" content="en_US" />

    <!--
      `summary_large_image` and not `summary`: the card is a screenshot of a
      line of Japanese, which is unreadable in the small square crop.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="kana. — Japanese typing practice" />
    <meta
      name="twitter:description"
      content="Practice Japanese typing in your browser. Type the romaji for kana and kanji, and see which moras slow you down — per mora, not per word. No signup."
    />
    <meta name="twitter:image" content="https://cherish-chen9336.github.io/Japanese-romaji/og.png" />
    <meta
      name="twitter:image:alt"
      content="The kana. practice screen: a line of Japanese with the romaji being typed beneath it."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
